name: Build

on:
  pull_request:
    branches:
      - production

permissions:
  contents: read

jobs:
  build:
    name: Lint and build theme
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: wp-content/themes/MNYphoto

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wp-content/themes/MNYphoto/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint theme source
        run: npm run lint

      - name: Build theme assets
        run: npm run build

      - name: Verify committed production bundles
        run: git diff --exit-code -- dist/css/bundle.css dist/js/bundle.js
